<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Css Link -->
    <link rel="stylesheet" href="./style.css" />
    <!-- Google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- end -->

    <!-- Font awesome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- end -->
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- Navbar Section -->
      <nav>
        <div class="logo">
          <img src="./assets/logo-navbar.png" alt="navbar logo image" />
        </div>
        <div class="menu-items">
          <ul>
            <li><a href="#">Features</a></li>
            <li><a href="#">How it works</a></li>
            <li><a href="#">Why it's Different</a></li>
          </ul>
        </div>
        <div class="btn">
          <button>Get Early Access</button>
        </div>
      </nav>
      <!-- Start Banner Section -->
      <section class="banner">
        <div class="banner-content">
          <button class="banner-btnA">Early Access Now Open</button>
          <div class="banner-text">
            <div class="title-text">
              <h1>Structured thinking,</h1>
              <h1 class="color-text">not just note-taking.</h1>
            </div>
            <div class="para-text">
              <p>
                A private space to store notes, links, and learning summaries —
                designed to <br />
                help you think clearly, connect ideas, and turn learning into
                long-term knowledge.
              </p>
            </div>
          </div>

          <div class="banner-btn">
            <button class="banner-btnB">
              Start Building Your Vault
              <img src="./assets/ArrowRight.png" alt="icon" />
            </button>
            <button class="banner-btnC">
              <i class="fa-solid fa-caret-right"></i> See How It Works
            </button>
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
